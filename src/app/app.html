<div class="app-layout">
  <app-header class="app-header-container"></app-header>

  <div class="app-body">
    <!-- Backdrop overlay for mobile drawer -->
    <div 
      class="mobile-nav-backdrop" 
      [class.active]="navService.isMobileNavOpen()" 
      (click)="navService.closeMobileNav()"
    ></div>

    <app-navigation 
      class="app-sidebar-container" 
      [class.mobile-open]="navService.isMobileNavOpen()"
    ></app-navigation>

    <main class="app-content">
      <div class="router-content">
        <router-outlet></router-outlet>
      </div>
      <app-footer class="app-footer-container"></app-footer>
    </main>
  </div>
</div>
